<svg xmlns="http://www.w3.org/2000/svg" viewBox="43 25 170 170">
  <defs>
    <clipPath id="remove-underline">
      <rect width="256" height="180"/>
    </clipPath>
    <filter id="one-pixel-thinner" x="-2%" y="-2%" width="104%" height="104%">
      <feMorphology in="SourceAlpha" operator="erode" radius="0.5" result="thin-alpha"/>
      <feComposite in="SourceGraphic" in2="thin-alpha" operator="in"/>
    </filter>
  </defs>
  <g clip-path="url(#remove-underline)" filter="url(#one-pixel-thinner)" transform="rotate(-5 128 104)">
    <image href="data:image/png;base64," width="256" height="256"/>
  </g>
</svg>
