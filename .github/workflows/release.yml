name: Build macOS release (ad-hoc signed)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and package app
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              .build/releases/CommitJet-*-macOS.zip \
              .build/releases/CommitJet-*-macOS.zip.sha256 \
              --notes-file "$NOTES_FILE" \
              --title "CommitJet $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              .build/releases/CommitJet-*-macOS.zip \
              .build/releases/CommitJet-*-macOS.zip.sha256 \
              --generate-notes \
              --title "CommitJet $GITHUB_REF_NAME"
          fi
